<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wind-down | The Personal Planner 2027</title>
<style>
:root{color-scheme:light;--pink:#d66e94;--line:#f0cbd8;--ink:#674550;--muted:#a9959d}*{box-sizing:border-box}body{margin:0;padding:12px;background:transparent;font-family:Arial,Helvetica,sans-serif;color:var(--ink)}.widget{max-width:660px;margin:auto;background:#fff8fa;border:1.5px solid #edc6d4;border-radius:30px;padding:32px 34px;box-shadow:0 8px 20px #6a29400c}h1{font:italic 35px Georgia,serif;color:var(--pink);font-weight:normal;margin:0 0 30px}.moon{font:normal 29px Georgia,serif;margin-right:12px}label.task{display:flex;align-items:center;gap:18px;margin:22px 0;font-size:20px;line-height:1.4;cursor:pointer}.task input{appearance:none;flex:none;width:27px;height:27px;border:2px solid var(--line);border-radius:50%;background:#fff;cursor:pointer}.task input:checked{background:var(--pink);border-color:var(--pink);box-shadow:inset 0 0 0 5px #fff}.task:has(input:checked) span{text-decoration:line-through;color:var(--muted)}.bottom{border-top:2px dashed #f5dce4;margin-top:30px;padding-top:24px}.prompt{font:italic 27px Georgia,serif;margin-bottom:16px}.entry{display:flex;gap:12px}input[type=text]{min-width:0;flex:1;border:1.5px solid var(--line);border-radius:20px;padding:16px 18px;font-size:17px;background:white;color:var(--ink)}button{border:0;border-radius:24px;background:var(--pink);color:white;padding:14px 24px;font-size:17px;font-weight:700;cursor:pointer}button:hover{background:#bd567c}.status{min-height:20px;color:#977782;font-size:13px;margin-top:12px}@media(max-width:450px){.widget{padding:24px 20px;border-radius:24px}h1{font-size:30px}label.task{font-size:17px;gap:12px}.entry{flex-wrap:wrap}button{width:100%}.prompt{font-size:23px}}
</style></head>
<body><main class="widget"><h1><span class="moon">☾</span>Wind-down</h1>
<label class="task"><input type="checkbox" data-task="0"><span>Phone on charge, away from the bed</span></label>
<label class="task"><input type="checkbox" data-task="1"><span>Skincare done</span></label>
<label class="task"><input type="checkbox" data-task="2"><span>Tomorrow's outfit ready</span></label>
<label class="task"><input type="checkbox" data-task="3"><span>Five slow breaths</span></label>
<div class="bottom"><div class="prompt">One thing for tomorrow</div><div class="entry"><input id="tomorrow" type="text" maxlength="180" placeholder="Just one thing..." aria-label="One thing for tomorrow"><button id="save" type="button">Tuck in ♡</button></div><div class="status" id="status" role="status"></div></div></main>
<script>
const key='personal-planner-2027-winddown-v1';const boxes=[...document.querySelectorAll('[data-task]')];const field=document.getElementById('tomorrow');const status=document.getElementById('status');let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}boxes.forEach((box,i)=>{box.checked=!!saved.tasks?.[i];box.addEventListener('change',save)});field.value=saved.tomorrow||'';document.getElementById('save').addEventListener('click',()=>{save();status.textContent='Saved for a peaceful tomorrow ♡'});function save(){try{localStorage.setItem(key,JSON.stringify({tasks:boxes.map(b=>b.checked),tomorrow:field.value}));status.textContent='Saved on this device ♡'}catch(e){status.textContent='Your browser is blocking local storage. Changes may not persist.'}}
</script></body></html>
