
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Priorities</title>

<style>
:root {
  --rose: #F6E4E7;
  --cream: #FFF9F5;
  --dusty: #A86F7B;
  --brown: #63464D;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 12px;
  background: var(--cream);
  color: var(--brown);
  font-family: Georgia, serif;
}

.widget {
  max-width: 520px;
  margin: auto;
  padding: 24px;
  background: #FFFFFF;
  border: 1px solid var(--rose);
  border-radius: 18px;
}

h1 {
  font-size: 27px;
  font-style: italic;
  font-weight: normal;
  margin: 0 0 8px;
}

.subtitle {
  font-size: 12px;
  color: var(--dusty);
  margin-bottom: 22px;
}

.task {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}

.task input[type="checkbox"] {
  width: 18px;
  height: 18px;
  accent-color: var(--dusty);
  cursor: pointer;
  flex-shrink: 0;
}

.task input[type="text"] {
  flex: 1;
  min-width: 0;
  border: 1px solid var(--rose);
  border-radius: 9px;
  background: var(--cream);
  color: var(--brown);
  padding: 12px;
  font: 13px Arial, sans-serif;
  outline-color: var(--dusty);
}

.task input[type="text"]:disabled {
  text-decoration: line-through;
  opacity: 0.65;
}

.footer {
  margin-top: 20px;
  font-size: 12px;
  font-style: italic;
  color: var(--dusty);
  text-align: center;
}
</style>
</head>

<body>
<div class="widget">

  <h1>Daily priorities ♡</h1>

  <div class="subtitle">
    Three little steps toward a lovely day.
  </div>

  <div id="tasks"></div>

  <div class="footer">
    A little progress is still progress. ♡
  </div>

</div>

<script>
const KEY = "rose-cream-daily-priorities";
const today = new Date().toLocaleDateString("en-CA");

let data;

try {
  data = JSON.parse(localStorage.getItem(KEY));
} catch (e) {
  data = null;
}

if (!data || !Array.isArray(data.tasks)) {
  data = {
    date: today,
    tasks: ["", "", ""],
    done: [false, false, false]
  };
}

if (data.date !== today) {
  data.date = today;
  data.done = [false, false, false];
}

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(data));
  } catch (e) {
    console.warn("Storage unavailable");
  }
}

const container = document.getElementById("tasks");

for (let i = 0; i < 3; i++) {
  const row = document.createElement("div");
  row.className = "task";

  const checkbox = document.createElement("input");
  checkbox.type = "checkbox";
  checkbox.checked = !!data.done[i];

  const input = document.createElement("input");
  input.type = "text";
  input.placeholder = "Priority " + (i + 1);
  input.value = data.tasks[i] || "";
  input.disabled = checkbox.checked;

  checkbox.addEventListener("change", () => {
    data.done[i] = checkbox.checked;
    input.disabled = checkbox.checked;
    save();
  });

  input.addEventListener("input", () => {
    data.tasks[i] = input.value;
    save();
  });

  row.append(checkbox, input);
  container.appendChild(row);
}

save();
</script>
</body>
</html>
